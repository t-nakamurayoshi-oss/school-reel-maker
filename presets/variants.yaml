# =============================================================
# presets/variants.yaml
#
# ABテスト用バリアント定義ファイル
#
# ここで「どんなリールを何パターン生成するか」を決めます。
# python make_reel_ab.py を実行すると、このファイルを読んで
# variants リストの数だけリール動画を生成します。
# =============================================================

# ============================================================
# グローバル設定
# variants 全体に共通する設定を記述します
# ============================================================

config:
  # Whisper（音声文字起こし）を使って文脈スコアを計算するか
  # true にすると精度が上がるが処理時間が大幅に増える
  # 初めて試すときは false のままで OK
  use_whisper: false

  # Whisper のモデルサイズ
  # "tiny"(最速・39MB) / "base"(74MB) / "small"(244MB) / "medium"(769MB)
  whisper_model: "tiny"


# ============================================================
# バリアント定義
#
# 【パラメータ説明】
#   name        : バリアント名。出力ファイル名 (reel_A.mp4) になります。
#   label       : 人間が読むための説明ラベル。
#   hook_mode   : 冒頭シーンの選び方。
#                   loud   = 最も音量が大きいシーン
#                   motion = 最も動きが激しいシーン
#                   face   = 顔が最も大きく映るシーン [要 OpenCV]
#                   smile  = 最も笑顔が多いシーン    [要 OpenCV]
#   clip_sec    : 1クリップの長さ（秒）
#   target_sec  : リール全体の目標時間（秒）。Instagram 上限は 90 秒。
#   bgm         : BGM ファイルのパス（null=なし）
#   crossfade_sec: シーン切り替えのフェード時間（秒）。0 でブツ切り。
#
#   weights     : カット選定に使うスコアの重み。
#                 合計が 1.0 になるように設定するのが分かりやすい。
#                 0 にするとそのスコアは無視される。
#
#     w_audio     : 音量スコアの重み（歓声・拍手などが大きいシーンを優先）
#     w_smile     : 笑顔スコアの重み [要 OpenCV]
#     w_face_size : 顔サイズスコアの重み [要 OpenCV]
#     w_motion    : 動きスコアの重み
#     w_context   : 文脈スコアの重み [要 Whisper + use_whisper: true]
#     w_shake     : 手ブレスコアの重み（値が高いほど安定した映像を優先）
#                   0.0 = 無視（デフォルト）/ 0.2 = 軽視 / 0.5 = 重視
#     w_tilt      : 傾きスコアの重み（値が高いほど水平な映像を優先） [要 OpenCV]
#                   0.0 = 無視（デフォルト）/ 0.2 = 軽視 / 0.5 = 重視
#
# 【手ブレ・傾きの自動補正について】
#   score_engine.py が自動的に「軽度」の手ブレ・傾きを補正します。
#     手ブレ: SHAKE_STABLE_THRESHOLD (2.0px) 〜 SHAKE_SEVERE_THRESHOLD (8.0px) → 自動補正
#     傾き  : TILT_IGNORE_DEG (0.5°) 〜 TILT_CORRECT_MAX (5.0°)            → 自動補正
#   「重度」のブレ・傾きは補正されませんが、w_shake / w_tilt を上げることで
#   スコアが下がり、カット選定から自然に除外されます。
# ============================================================

variants:

  # ── バリアント A: 笑顔重視 ──
  # 「笑顔が多く映っているシーン」を優先してカットを選ぶ。
  # 保護者や地域の方向けに「温かい雰囲気」を伝えるリールに向く。
  # ※ 笑顔スコアを使うには OpenCV が必要（pip install opencv-python-headless）
  - name: "A"
    label: "笑顔重視（温かい雰囲気）"
    hook_mode: "smile"        # 最も笑顔が多いシーンを冒頭に
    clip_sec: 3
    target_sec: 60
    bgm: null
    crossfade_sec: 0.3
    weights:
      w_audio:     0.1        # 音量は控えめ
      w_smile:     0.5        # 笑顔を最重視
      w_face_size: 0.2        # 顔のサイズも考慮（クローズアップ優先）
      w_motion:    0.1        # 動きは控えめ
      w_context:   0.1        # 文脈（Whisper 無効の場合は 0 扱い）
      w_shake:     0.0        # 手ブレスコア（0=無視）
      w_tilt:      0.0        # 傾きスコア（0=無視）

  # ── バリアント B: 音量（盛り上がり）重視 ──
  # 「歓声・拍手・笑い声が大きいシーン」を優先。
  # 運動会・体育祭など盛り上がりを伝えたい場合に向く。
  - name: "B"
    label: "音量重視（歓声・盛り上がり）"
    hook_mode: "loud"         # 最も音量が大きいシーンを冒頭に
    clip_sec: 3
    target_sec: 60
    bgm: null
    crossfade_sec: 0.3
    weights:
      w_audio:     0.6        # 音量を最重視
      w_smile:     0.1
      w_face_size: 0.1
      w_motion:    0.2        # 動きも少し重視
      w_context:   0.0
      w_shake:     0.0        # 手ブレスコア（0=無視）
      w_tilt:      0.0        # 傾きスコア（0=無視）

  # ── バリアント C: 動き重視（テンポ速め）──
  # 「動きが激しいシーン」を優先し、短いクリップで次々と場面転換。
  # スポーツ系行事や文化祭の華やかなシーンに向く。
  - name: "C"
    label: "動き重視（アクティブ・テンポ速め）"
    hook_mode: "motion"       # 最も動きが激しいシーンを冒頭に
    clip_sec: 2               # 短めクリップでテンポアップ
    target_sec: 45
    bgm: null
    crossfade_sec: 0.1        # 短いフェードでスピード感
    weights:
      w_audio:     0.2
      w_smile:     0.1
      w_face_size: 0.1
      w_motion:    0.6        # 動きを最重視
      w_context:   0.0
      w_shake:     0.0        # 手ブレスコア（0=無視）
      w_tilt:      0.0        # 傾きスコア（0=無視）

  # ──────────────────────────────────────────
  # 以下はコメントアウトされたサンプルです。
  # ──────────────────────────────────────────

  # バリアント D: 文脈重視（Whisper 必須）
  # 「ありがとう」「最高」「頑張った」などポジティブな発言が多いシーンを優先。
  # use_whisper: true に変更してから有効にしてください。
  # - name: "D"
  #   label: "文脈重視（ポジティブ発言優先）"
  #   hook_mode: "loud"
  #   clip_sec: 3
  #   target_sec: 60
  #   bgm: null
  #   crossfade_sec: 0.3
  #   weights:
  #     w_audio:     0.1
  #     w_smile:     0.2
  #     w_face_size: 0.1
  #     w_motion:    0.1
  #     w_context:   0.5  # 文脈スコアを最重視（Whisper 必須）
  #     w_shake:     0.0
  #     w_tilt:      0.0

  # バリアント E: バランス型（全スコアを均等に）
  # - name: "E"
  #   label: "バランス型（全スコア均等）"
  #   hook_mode: "loud"
  #   clip_sec: 3
  #   target_sec: 60
  #   bgm: null
  #   crossfade_sec: 0.3
  #   weights:
  #     w_audio:     0.15
  #     w_smile:     0.15
  #     w_face_size: 0.15
  #     w_motion:    0.15
  #     w_context:   0.15
  #     w_shake:     0.15
  #     w_tilt:      0.15

  # バリアント F: 映像品質重視（手ブレ・傾きなしを優先）
  # 手ブレ・傾きのない安定した映像を優先してカットを選ぶ。
  # 式場・式典など「落ち着いた雰囲気」を伝えたい場合に向く。
  # - name: "F"
  #   label: "映像品質重視（安定・水平な映像優先）"
  #   hook_mode: "face"
  #   clip_sec: 3
  #   target_sec: 60
  #   bgm: null
  #   crossfade_sec: 0.5
  #   weights:
  #     w_audio:     0.1
  #     w_smile:     0.2
  #     w_face_size: 0.1
  #     w_motion:    0.1
  #     w_context:   0.0
  #     w_shake:     0.25  # 手ブレの少ない安定した映像を優先
  #     w_tilt:      0.25  # 傾きの少ない水平な映像を優先
