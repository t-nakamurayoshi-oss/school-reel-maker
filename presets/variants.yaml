# =============================================================
# presets/variants.yaml
#
# ABテスト用バリアント定義ファイル
#
# ここで「どんなリールを何パターン生成するか」を決めます。
# python make_reel_ab.py を実行すると、このファイルを読んで
# variants リストの数だけリール動画を生成します。
#
# 【パラメータ説明】
#   name        : バリアント名。出力ファイル名 (reel_A.mp4) になります。
#   label       : 人間が読むための説明ラベル。
#   hook_mode   : 冒頭シーンの選び方。
#                   loud   = 最も音量が大きいシーンを最初に配置
#                   motion = 最も動きが激しいシーンを最初に配置
#                   face   = 顔が大きく映っているシーン（将来実装予定、現在はloudにフォールバック）
#   clip_sec    : 1クリップの長さ（秒）。短いとテンポが速く、長いとゆったりした印象に。
#   target_sec  : リール全体の目標時間（秒）。Instagram リールの上限は 90 秒。
#   bgm         : BGM ファイルのパス（null=なし）。例: "assets/bgm.mp3"
#   crossfade_sec: シーン切り替えのフェード時間（秒）。0 にするとブツ切り。
# =============================================================

variants:

  # ── バリアント A: 歓声・盛り上がり優先 ──
  # 音量が一番大きいシーン（歓声、笑い声、拍手など）を冒頭に持ってくる。
  # 学校行事でよくある「みんなで盛り上がっている瞬間」を前面に出す戦略。
  - name: "A"
    label: "音量重視（歓声・盛り上がり優先）"
    hook_mode: "loud"
    clip_sec: 3
    target_sec: 60
    bgm: null
    crossfade_sec: 0.3

  # ── バリアント B: アクション・動き優先 ──
  # フレーム間の差分が大きいシーン（走る、踊る、競技など）を冒頭に配置。
  # 静的なシーンより動きのあるシーンを優先する戦略。
  - name: "B"
    label: "動き重視（アクティブなシーン優先）"
    hook_mode: "motion"
    clip_sec: 4
    target_sec: 60
    bgm: null
    crossfade_sec: 0.5

  # ── バリアント C: テンポ速め・ハイライト集 ──
  # クリップを短め(2秒)にしてテンポを上げる。
  # 全体も短め(45秒)にしてさくっと見られる構成。
  - name: "C"
    label: "短めテンポ（ハイライト速め・45秒）"
    hook_mode: "loud"
    clip_sec: 2
    target_sec: 45
    bgm: null
    crossfade_sec: 0.1

  # ──────────────────────────────────────────
  # 以下はコメントアウトされたサンプルです。
  # 必要に応じてコメントを外して使ってください。
  # ──────────────────────────────────────────

  # バリアント D: 長尺・じっくり見せる版
  # - name: "D"
  #   label: "長尺（ストーリー重視・90秒）"
  #   hook_mode: "loud"
  #   clip_sec: 5
  #   target_sec: 90
  #   bgm: null
  #   crossfade_sec: 0.5

  # バリアント E: BGM あり版
  # ※ assets/bgm.mp3 を用意してからコメントを外してください
  # - name: "E"
  #   label: "BGMあり版"
  #   hook_mode: "loud"
  #   clip_sec: 3
  #   target_sec: 60
  #   bgm: "assets/bgm.mp3"
  #   crossfade_sec: 0.3
